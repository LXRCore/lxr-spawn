<!DOCTYPE html>
<!-- LXR-SPAWN | LXR UI Kit | © 2026 iBoss21 / LXRCore | lxrcore.com -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ride out</title>
  <link rel="stylesheet" href="lxr-ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="lxr">
  <div id="app" class="lxr-hidden">
    <header class="sp-top lxr-hit">
      <div class="sp-brand">
        <img class="sp-logo" src="img/lxrcore-logo.png" alt="">
        <div><span class="lxr-mono lxr-t-ash" id="server-name"></span><h1 class="lxr-cut sp-title" id="t-title"></h1></div>
      </div>
      <div class="sp-hints lxr-mono lxr-t-smoke"><span class="lxr-key">↑ ↓</span><span data-l="hint_pick"></span><span class="lxr-key">Enter</span><span data-l="hint_go"></span></div>
    </header>

    <aside class="sp-panel lxr-hit">
      <div class="sp-panel__head lxr-rule-b"><span class="lxr-mono lxr-t-ash" id="t-subtitle"></span><span class="lxr-grow"></span><span class="lxr-mono lxr-t-smoke" id="count"></span></div>
      <div class="sp-rows" id="options"></div>
      <footer class="sp-panel__foot"><button class="lxr-btn sp-go" id="btn-spawn" disabled></button></footer>
    </aside>
  </div>
  <script src="app.js"></script>
</body>
</html>
