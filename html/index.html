<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LXR Spawn</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="hidden">
    <aside class="lxr-panel">
        <header class="lxr-banner">
            <div class="lxr-banner__avatar-wrap">
                <img id="brand-logo" class="lxr-banner__avatar" src="img/lxrcore-logo.png" alt="LXRCore">
            </div>
            <div class="lxr-banner__text">
                <div id="server-name" class="lxr-banner__title">LXRCore</div>
                <div id="server-tagline" class="lxr-banner__sub"></div>
            </div>
        </header>
        <div class="lxr-panel__head">
            <h1 id="t-title" class="lxr-title">Where do you ride from?</h1>
            <p id="t-subtitle" class="lxr-muted">Pick a place to begin</p>
        </div>
        <ul id="options" class="lxr-list lxr-scroll-minimal"></ul>
        <footer class="lxr-panel__foot">
            <button id="btn-spawn" class="cfg-btn cfg-btn--primary cfg-btn--block" disabled>Ride out</button>
        </footer>
    </aside>
</div>
<script src="app.js"></script>
</body>
</html>
